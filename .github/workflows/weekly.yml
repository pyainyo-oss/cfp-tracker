name: Weekly CFP Check

on:
  schedule:
    - cron: '0 2 * * 1'   # Monday 2:00 UTC = 8:30 AM Myanmar time
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run CFP tracker
        run: python cfp_tracker.py

      - name: Upload Excel file
        uses: actions/upload-artifact@v4
        with:
          name: CFP_Tracker_Myanmar
          path: CFP_Tracker_Myanmar.xlsx
          if-no-files-found: error
          retention-days: 30

      - name: Upload run log (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run_log
          path: run_log.txt
          if-no-files-found: ignore
          retention-days: 7
